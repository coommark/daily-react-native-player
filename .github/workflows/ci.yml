name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Test plugin
        run: yarn test plugin
      - name: Build
        run: yarn build
      - name: Pack check
        run: yarn pack:check
      # Android assembleRelease requires example prebuild (no repo-root gradlew).
      # Residual: run locally after `cd example && npx expo prebuild --platform android`
      # then `cd android && ./gradlew assembleRelease`. See docs/getting-started.md.
