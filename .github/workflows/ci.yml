name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Test plugin
        run: yarn test plugin
      - name: Pack check
        run: yarn pack:check

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install root
        run: yarn install --frozen-lockfile
      - name: Build package
        run: yarn build
      - name: Install example
        working-directory: example
        run: yarn install --frozen-lockfile
      - name: Prebuild Android
        working-directory: example
        run: npx expo prebuild --platform android --no-install
      - name: Assert prebuild injections
        run: yarn assert:prebuild
      - name: Assemble release (R8)
        working-directory: example/android
        run: ./gradlew :app:assembleRelease --no-daemon
